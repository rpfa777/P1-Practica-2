<!DOCTYPE html><!--Define el archivo como HTML-->
<html lang="en"><!--Establece el archivo en español-->
<head><!--Encabezado-->
    <meta charset="UTF-8"><!--Sirve para mostrar acentos, la letra ñ, mostrar carácteres variados -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--Sirve para que sea funcional en celulares-->
    <title>Enlaces en HTML</title><!--El titulo que se mostrara en el link-->
</head><!--Se cierra el encabezado-->
<body><!--El cuerpo de la página-->
    <h2>Tipos de enlaces en HTML</h2>
    <p><strong>Enlaces/Hipervinculos a otra pagina del
         mismo sitio.<!--Strong sirve para poner en negrita el texto-->
    </strong></p><!--Cierra strong y parrafo-->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>
    <a href="2. Encabezados.html" target="_self"><!--Enlace que abre una pagina en la misma pestaña -->
        2. Encabezados</a><br>
    <a href="3. Parrafos.html" target="_blank"><!--Enlace que abre una pagina en una pestaña nueva -->
        3. Parrafos</a><br>
    <a href="4. Salto de linea.html" target="_parent"><!--Enlace que abre una pagina en el marco principal -->
        4. Salto de linea</a><br>
    <a href="5. Enfatizado.html" target="_top"><!--Enlace que abre una pagina en toda la pantalla -->
        5. Enfatizado</a><br>
    <p><strong>Enlaces/Hipervinculos a sitios externos
    </strong></p>
    <a href="https://www.google.com/">Google</a><br><!--Abre una pestaña que te lleva a google -->
    <a href="https://www.youtube.com/" target="_self"><!--Abre una pestaña que te lleva a youtube -->
        YouTube</a><br>
    <a href="https://www.facebook.com/" target="_blank"><!--Abre una pestaña que te lleva a youtube -->
        FaceBook</a><br>
    <a href="https://www.wikipedia.com/" target="_parent"><!--Abre una pestaña que te lleva a wikipedia -->
        WikiPedia</a><br>
    <a href="https://www.espanol.yahoo.com/" target="_top"><!--Abre una pestaña que te lleva a yahoo-->
        Yahoo!</a><br>
</body>
</html>
