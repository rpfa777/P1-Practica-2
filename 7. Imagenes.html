<!DOCTYPE html><!--Define el archivo como HTML-->
<html lang="en"><!--Establece el archivo en español-->
<head><!--Encabezado-->
    <meta charset="UTF-8"><!--Sirve para mostrar acentos, la letra ñ, mostrar carácteres variados -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--Sirve para que sea funcional en celulares-->
    <title>Imagenes en HTML</title><!--El titulo que se mostrara en el link-->
</head><!--Se cierra el encabezado-->
<body><!--El cuerpo de la página-->
    <h2>Imagenes en HTML</h2>
    <h3>Locales</h3>
    <img src="caritas.png" alt="Imagen de carita feliz"><!--img Sirve para insertar una imagen, alt muestra el texto de lo que aparece en caso de fallar la imagen-->
    <h3>Locales redismensionado</h3>
    <img src="imagenes/carita.png" alt="" width="200" height="100"><!--Modifica el tamaño de la imagen-->
    <h3>Desde internet</h3>
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200" 
    alt=""> <!--Sirve para insertar una imagen con un link, y la imagen se abre desde internet pero insertandola en mi página-->

    <h3>Animaciones</h3>
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt=""> <!--Sirve para insertar una gif con un link, y se abre desde internet pero insertandola en mi página-->

</body>
</html>
